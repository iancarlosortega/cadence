product_decisions: confirmed

resolved_product_decisions:
  - id: P1
    question: Which tiers ship in M5.
    resolved: 2026-10-03
    decision: A
    label: Detection + T3
    meaning: >-
      Real detection for all signals, the Tier publication fix (D1), and T3 silent skip. T2 policy
      and its corner panel and pill move to M6.
  - id: P2
    question: Run a research lane that measures the signals live during a real call before design.
    resolved: 2026-10-03
    decision: A
    label: Yes, research first
  - id: P3
    question: >-
      What happens to T1, which has no observable effect today (the overlay has no sound and the
      hold is already 3s).
    resolved: 2026-10-03
    decision: A
    label: Collapse T1 into T0
    meaning: >-
      The mic is still detected so the Tier property is truthful, but a T1 break behaves exactly
      like T0.

  - id: P4
    question: What a T2 (camera) break does in M5, since the T2 policy and its corner panel moved to M6.
    resolved: 2026-10-03
    decision: A
    label: Treat T2 as T0
    meaning: The overlay shows on camera. T2 is detected and published, but gates nothing until M6.
  - id: P5
    question: Whether a local screen recording counts as presenting (research U2).
    resolved: 2026-10-03
    decision: A
    label: Any screencast is T3
    meaning: >-
      Any Mutter ScreenCast session, including the GNOME recorder and OBS, silently skips the break.

latent_defects:
  - id: D1
    where: "daemon/internal/dbusapi/service.go:198-206 with daemon/internal/session/machine.go applyTick default branch"
    what: >-
      A tick whose only change is the tier returns no effects, so Tier is never republished until
      the next transition. Unreachable while the stub is constant; M5 makes it reachable.
  - id: D2
    where: "daemon/internal/session/machine.go:223-237 transitionPhase"
    what: >-
      Any non-T0 tier at the focus deadline restarts a full focus block (elapsed zeroed, phase
      unchanged). That is close to T3 silent skip, and wrong for T2 and T1.

notes:
  - SDD sub-agent dispatch is refused in this runtime, so phases run inline, as in M1-M4.
