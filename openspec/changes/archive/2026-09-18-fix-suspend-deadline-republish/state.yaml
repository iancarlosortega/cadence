delivery_note: >-
  Preflight collected 2026-09-18 for this change: interactive pace, openspec artifacts,
  single-pr delivery. The change is expected well under 100 lines, so the 400-line budget
  is not in play. Commit and push remain separate human decisions.

summary: >-
  Emit EffectNotify on the two paths that move the effective phase deadline without a phase
  change (short suspend, idle pause), so PhaseEndsAt is republished and clients stop drifting
  from the daemon. Amends the daemon-control Change Notification requirement and fixes the
  test that discarded the effects and hid the defect.

