rescopes:
  - id: R1
    date: 2026-09-18
    phase: design
    what: The idle-pause path was removed from scope after being accepted into it.
    why: >-
      Product decision P1 was taken on my stated basis that the idle branch was the same one-line
      fix as the suspend branch. Design proved that false. The branch runs on every tick while idle,
      so an unguarded EffectNotify is a per-second heartbeat and it needs edge detection, for which
      the natural mechanism (IdleSince, state.go:57) is declared but never read or written anywhere.
      More decisively, during idle LastObserved advances while ElapsedInPhase is frozen, so the
      correct deadline moves continuously across the window rather than at its edges; edge emission
      would bound the error, not remove it. Removing it requires deciding what a client shows while
      idle, which changes the D-Bus contract M2 consumes and is M4 design work.
    user_ruling: >-
      Presented with the corrected analysis on 2026-09-18, the user chose "suspend only, idle to M4".
    consequence: >-
      The user's earlier P1 answer was made on inaccurate information from me and has been
      superseded rather than silently honoured.

findings:
  - id: F2
    title: Idle-pause path shares the defect class and is handed to M4
    discovered: 2026-09-18
    discovered_by: design of this change
    severity: medium
    owner: M4 (idle gating)
    status: deferred
    reachable_today: false
    summary: >-
      applyTick's idle-pause branch (machine.go:100-105) declines to advance elapsed while wall time
      passes, which moves the effective deadline, and returns no effects at all — neither notify nor
      persist. Its comment asserts "nothing observable changed", which is false.
    why_not_fixed_here: >-
      It is not the same fix. It needs edge detection because the branch runs every tick, and even
      correct edge emission leaves a client wrong for the length of the idle window because the
      deadline advances continuously throughout it. Being fully correct requires an idle display
      decision that changes the published contract.
    unreachable_because: IdleSource is stubbed to zero until M4, so the branch never executes.
    m4_obligations:
      - Satisfy the daemon-control Change Notification requirement for the idle paths it makes reachable.
      - Decide what a client displays during an idle window, since the deadline advances throughout it.
      - Either bring the dead IdleSince field (state.go:57) to life or delete it.
      - Delete the "nothing observable changed" comment, which is false.

product_decisions: confirmed

resolved_product_decisions:
  - id: P1
    question: >-
      Is the idle-pause path in scope, given it carries the identical defect but is
      unreachable until M4 because IdleSource is stubbed to zero?
    raised_by: exploration Decision 2
    resolved: 2026-09-18
    decision: fix-both-paths
    superseded_by: R1
    status: superseded
    answer: >-
      SUPERSEDED at design by rescope R1. Originally both paths; now the suspend path only, with the
      idle path deferred to M4 as finding F2.
    rationale: >-
      Apply is a pure function, so the idle path is provable and testable today by passing
      EventTick{IdleFor}, which makes this an existing defect in existing code rather than
      speculative future-proofing. Fixing it now means M4 inherits a correct domain, and the
      misleading "nothing observable changed" comment dies before it misleads whoever writes
      idle gating.

resolved_technical_decisions:
  - id: D1
    question: What the daemon-control Change Notification requirement should actually require
    resolved: 2026-09-18
    decision: key-on-changed-value
    answer: >-
      Rewrite the requirement so the trigger is a change to a published property's correct
      value, with the prohibition scoped to a tick that changes nothing. The current wording,
      "on transitions only", was read as "only on phase transitions" and is how both defects
      were written without review catching them.
  - id: D2
    question: Does emitting on these paths conflict with the no-per-second-traffic rule
    resolved: 2026-09-18
    decision: no-conflict
    answer: >-
      A suspend/resume is rare and discrete. The idle-pause case emits once when the threshold
      is crossed, not per tick, because the state stops advancing and further ticks produce no
      change. The rule forbids a heartbeat, not reporting real changes.

verified_facts:
  defective_paths:
    - "daemon/internal/session/machine.go:123-139 applySuspend short-suspend path"
    - "daemon/internal/session/machine.go:100-105 applyTick idle-pause path"
  publish_trigger: "daemon/internal/dbusapi/service.go:169-188, publish runs only on EffectNotify"
  deadline_computation: "service.go:194-202, endsAt = now + Remaining(), already correct"
  test_that_hid_it: "machine_test.go:129 discards effects via `next, _ := Apply(...)`"
  sibling_test_asserts_effects: "machine_test.go:118-120 TestLongSuspendCreditsBreak"
  measured_offset: "constant 3s across 3 samples 20s apart after a 9s suspend, 2026-09-18"
  idle_source_stubbed: true

risks:
  - A future edit silently dropping the notification again; both tests now assert on effects.
  - >-
    Idle-pause cannot be verified end-to-end until M4 ships real idle detection; the table test
    drives Apply directly in the meantime.
  - >-
    The sleep.go cold-start edge (sleepStarted initialises to clock.Now, so a daemon starting
    during a suspend computes From = daemon start) is real, adjacent and deliberately out of scope.

notes:
  - >-
    SDD sub-agent dispatch is refused in this runtime, so all phases run inline, as in M1 and M2.
  - >-
    Found while verifying M2 task 6.3 on a live daemon rather than by reading code, which is why
    the measurement, not the source, is the primary evidence in exploration.
