change: m4-idle-awareness
project: cadence
created: 2026-09-19
artifact_store: openspec
execution_mode: auto
delivery_strategy: exception-ok
chain_strategy: null
delivery_note: >-
  Preflight collected 2026-09-19 for this change: automatic pace, openspec artifacts. The user
  develops this personally and pushes straight to main, and accepted size:exception up front, so
  the 400-line budget never stops the chain before apply. The tasks forecast still reports the
  estimate. Commit and push remain separate human decisions.

summary: >-
  Make idle detection real and make the idle path honest to clients. Replaces the zero-stub
  IdleSource with a working adapter, and resolves the contract question deferred as finding F2:
  what a client displays while the user is idle, given the correct PhaseEndsAt advances
  continuously across the idle window rather than at its edges.

phases:
  explore:
    state: done
    artifact: openspec/changes/m4-idle-awareness/exploration.md
  research:
    state: done
    artifact: openspec/changes/m4-idle-awareness/research.md
    lane: idle-source
    claims: 9
    method: >-
      Primary evidence is empirical, measured on the user's own machine (Fedora 42, GNOME Shell 48,
      Wayland) via busctl on the live session bus. Web search was secondary and largely unhelpful;
      the upstream interface turned out to be undocumented, which is itself claim C5.
    outcome: >-
      P2's central unknown is resolved in the affirmative. org.gnome.Mutter.IdleMonitor is exported
      by gnome-shell on the session bus and is reachable from a plain user process outside the Shell,
      so no Shell-side reporter is needed and the extension stays a pure consumer. GetIdletime
      returns uint64 milliseconds advancing 1:1 with real time, which maps onto the existing
      IdleFor(now) port with no contract change.
    unverified:
      - >-
        C7 locked-screen behavior. Not testable without locking the session and not documented
        upstream. Matters because a locked screen is unambiguously time away and should reach
        IdleCredit. Owed as a live-session check, like M2's post-logout checks.
      - >-
        C8 suspend interaction, the highest risk found. cadence already credits suspend via login1
        and applySuspend. If GetIdletime also accrues across a suspend, a resume could credit the
        same absence twice. The CLOCK_MONOTONIC reasoning suggests it does not, but that is
        inference across two layers, not measurement. Owed as a real-suspend measurement.

