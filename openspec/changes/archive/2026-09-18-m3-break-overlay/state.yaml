    note: >-
      A documentation research pass was run, then checked against the Shell 48.8 source extracted
      from libshell-16.so on this machine. THREE of its claims were wrong and are corrected in the
      exploration: addTopChrome() does exist; pushModal DOES auto-release its grab when the actor is
