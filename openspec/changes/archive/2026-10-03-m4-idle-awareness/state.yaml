      nothing was silently dropped.
    deliberate_scenario_changes:
      - capability: session-timer
        requirement: Idle Credit
        scenario: Short idle pauses
        change: >-
          Gained "AND the idle window has been published as open". This is the inversion the
          exploration flagged: the scenario previously pinned "no effect", which was a correct test
          of an incorrect requirement. The spec moves here so the test can follow at apply rather
          than the change looking like a regression.
      - capability: daemon-control
        requirement: Change Notification
        scenario: A client never drifts across suspends and transitions
        change: >-
          Renamed and widened to "A client never drifts across suspends, idle windows and
          transitions", and its client definition now covers reading RemainingSeconds during a
          frozen interval. Not a deletion: the previous property is retained and extended over the
          paths M4 makes reachable. This is the scenario fix-suspend-deadline-republish narrowed at
          its design phase precisely because idle was out of its scope.
    note: >-
      Three capabilities, no new ones. The delta discharges the general Change Notification
      obligation carried since fix-suspend-deadline-republish and removes its trailing "M4 must
      satisfy this" note, because M4 now does. New requirement "Idle Publication" fixes Paused
      taking precedence over Idle so exactly one frozen-interval condition is ever on the wire, and
      new requirement "Idle Source Availability" makes zero idle the documented safe value when the
      compositor interface is absent. panel-indicator "Control Actions" now states explicitly that
      menu sensitivity derives from Paused and never from Idle, which is the spec-level guard
      against the Option A corruption path.
  design:
    state: done
    artifact: openspec/changes/m4-idle-awareness/design.md
    decisions: 8
    word_count: 1995
    note: >-
      Decision 2 is the find of the phase: applyTick's credit branch is unconditional, and observed
      idle from a real source grows monotonically and is never reset by crediting, so every tick
      past the credit threshold would reset the phase, write state and emit a signal for the whole
      absence. Unreachable today only because IdleSource is stubbed, which is exactly the condition
      M4 removes. Fixed with an IdleCredited latch, which also removes research risk C8
      structurally: applySuspend sets the same flags when it credits, so a following tick stays
      silent whether or not GetIdletime accrues across suspend. C8 is still measured, but as
      confirmation rather than a load-bearing dependency.
    decisions_summary:
      - "D1: poll GetIdletime rather than subscribe to Mutter idle watches; tickInterval is 5s (main.go:25), so polling costs 12 round trips a minute and is self-correcting where a missed watch edge is not"
      - "D2: latch the credit branch with State.IdleCredited; fixes the repeated-credit defect and removes C8 structurally"
      - "D3: Idle and IdleCredited replace IdleSince, which is deleted; F2's revive-or-remove obligation discharged by removal"
      - "D4: idle needs no frozen-remaining field, because ElapsedInPhase is frozen so Remaining() is already constant for the window; publish only treats idle as a frozen interval"
      - "D5: EventPause clears Idle, enforcing the Paused-over-Idle precedence the spec requires"
      - "D6: adapter fails safe to zero with no name watching, logging on availability transition rather than per failure (12 failures a minute otherwise)"
      - "D7: assert the millisecond conversion in a test, because research C5 found no upstream contract for the unit"
      - "D8: idle flags are runtime state and are not persisted; bounded cost is one extra credit after a restart mid-window, preferred over a stale latch suppressing a legitimate credit"
    spec_revision_triggered: >-
      Design raised session-timer specs to revision 2. The repeated-credit defect found in D2 was
      not pinned by the spec as written: "A single absence MUST credit at most one break" existed
      only under Suspend Is Time Away, leaving the idle path uncovered. Idle Credit gained the
      conditioning requirement and two scenarios, "A long absence credits exactly one break" and
      "A second absence credits again".
