product_decisions: confirmed

resolved_product_decisions:
  - id: P1
    question: How much should the break overlay block?
    raised_by: exploration Decision 2
    resolved: 2026-09-18
    decision: visual-and-mouse-no-modal
    answer: >-
      addTopChrome only, no pushModal. The overlay covers the primary monitor above all windows and
      absorbs mouse clicks, but Alt+Tab, Super and workspace switching keep working.
    rationale: >-
      A nudge rather than a cage, which is the honest level for a personal stand-up reminder the user
      can always overrule. It also deletes the entire trapping risk class: no grab to leak, no
      ActionMode gating rescue shortcuts, and no popModal throwing on a double teardown.
  - id: P2
    question: What should the overlay do when the primary monitor is in fullscreen?
    raised_by: exploration Decision 4
    resolved: 2026-09-18
    decision: suppress-entirely-for-that-break
    answer: >-
      Evaluate Main.layoutManager.primaryMonitor.inFullscreen once, when the break begins. If
      fullscreen, no overlay for that break. The daemon still runs the break and the panel still
      shows it.
    rationale: >-
      A tool that covers the screen mid video call is a tool that gets uninstalled. Evaluated once
      rather than continuously so it cannot appear partway through a call or flicker as fullscreen
      toggles. The rejected alternative — re-showing for the remaining time after fullscreen ends —
      surfaces a nearly expired break at an arbitrary moment and needs more state.

resolved_technical_decisions:
  - id: D1
    question: New capability or extend panel-indicator
    resolved: 2026-09-18
    decision: new-capability
    answer: >-
      A new break-overlay capability. An overlay is a different surface with different requirements,
      and folding it into a capability named for a panel indicator would make that name a lie.
  - id: D2
    question: Who ends the overlay
    resolved: 2026-09-18
    decision: overlay-owns-its-exit
    answer: >-
      Four independent dismissal paths: the locally computed remainder reaching zero, a phase change
      away from break, the daemon's name leaving the bus, and disable(). Invariant I1 from M2 applied
      where it has consequences — F3 proved the daemon can vanish, and an overlay waiting on a dead
      daemon is a covered screen with no exit.
  - id: D3
    question: Where visibility logic lives
    resolved: 2026-09-18
    decision: pure-predicate-in-render
    answer: >-
      shouldShowOverlay(state, nowSeconds, suppressed) in render.js beside computeDisplay, so it is
      unit-testable outside the Shell. overlay.js holds only actor construction and lifecycle.

verified_facts:
  source_of_truth: "Shell 48.8 JS extracted from /usr/lib64/gnome-shell/libshell-16.so"
  addChrome: "places the actor BELOW global.top_window_group, i.e. under normal windows"
  addTopChrome: "exists; places at the top of uiGroup, above windows — what an overlay needs"
  chrome_defaults: "trackFullscreen false, affectsStruts false, affectsInputRegion true"
  in_fullscreen: "Monitor.inFullscreen = global.display.get_monitor_in_fullscreen(this.index)"
  push_modal_returns: "a Clutter.Grab from global.stage.grab(actor)"
  push_modal_auto_release: "connects actor 'destroy' and calls popModal(grab) from it"
  pop_modal_double_release: "throws Error('incorrect pop')"
  track_actor_cleanup: "_trackActor untracks chrome on the actor's destroy signal"
  st_settings: "exposes enable-animations and slow-down-factor"
  skip_break_semantics: "no-op unless active and phase is break; resets to focus with elapsed 0"

risks:
  - Overlay outliving the break; mitigated by four independent dismissal paths.
  - Dangling hold timer or transition; cleared on release, leave and teardown.
  - Not verifiable without a session cycle, as with M2; needs a runbook.

notes:
  - SDD sub-agent dispatch is refused in this runtime, so all phases run inline, as in M1 and M2.
  - >-
    Both product decisions came back conservative, which materially simplified the change: no modal
    grab removes the trapping risk class entirely, and once-at-break-start suppression removes a
    state machine.
