risks:
  - Verification requires cadenced installed and running; it is neither today.
  - Wayland cannot restart the Shell in place; dev loop is logout/login or a nested
    session, and the nested instance is not fully isolated from the host.
  - No automated test harness exists for GNOME Shell extensions; the extension half is
    verified manually. strict_tdd stays false and M2 does not change it.
  - Leaks in disable() (1s GLib source, D-Bus proxy, signal handlers) are the likeliest
    real defect and are explicit review-guideline violations.
  - Paused publishes PhaseEndsAt as 0; a naive countdown renders a negative timer.
  - >-
    Amber must be derived client-side: specs/daemon-control forbids per-second traffic,
    so no daemon signal for T-2min exists or will be added.

notes:
  - SDD sub-agent dispatch is refused in this runtime (Claude Code hooks expose no
    authenticated caller provenance). All phases run inline, as in M1.
  - M2 is consumer-only. The four merged daemon specs are unchanged; if M2 turns out to
    need a daemon change, that is a finding to surface, not a plan to execute.

findings:
  - id: F1
    title: Daemon does not republish PhaseEndsAt after a short suspend
    discovered: 2026-09-18
    discovered_by: task 6.3 (I1 suspend check)
    severity: high
    owner: daemon
    status: open
    summary: >-
      applySuspend (daemon/internal/session/machine.go:123-139) returns EffectPersist with no
      EffectNotify on the short-suspend path. The daemon correctly declines to charge a suspend
      shorter than the idle-credit threshold to the current phase (M1 decision P1), which moves the
      effective deadline forward, but never republishes PhaseEndsAt. Every client therefore keeps
      counting to a stale deadline until some later transition happens to republish it.
    evidence: >-
      systemd-logind recorded a 9-second suspend (15:03:57 to 15:04:06). Afterwards the value the
      extension renders (PhaseEndsAt minus now) sat a constant 3 seconds ahead of the daemon's
      elapsed-derived remaining across three samples taken 20 seconds apart. A constant offset, not
      converging drift. The long-suspend path (creditBreak) does emit EffectNotify; only the short
      path omits it.
    impact: >-
      The error is bounded by the idle-credit threshold, so a suspend just under 10 minutes can leave
      the panel roughly nine minutes wrong about when to stand up.
    not_an_extension_bug: >-
      The extension does exactly what invariant I1 and the panel-indicator spec require. M2 stays
      consumer-only per its proposal's Out of Scope clause, which states that a needed daemon change
      is a finding to surface rather than work to absorb.
    proposed_fix: >-
      Add EffectNotify to the short-suspend return in applySuspend so PhaseEndsAt is republished on
      resume. A suspend is a genuine transition, so this does not conflict with the daemon-control
      requirement forbidding per-second traffic.
    blocks: [task 6.3, success criterion 8]

corrections:
  - id: C1
    date: 2026-09-18
    what: Success criterion 8 and the panel-indicator spec scenario "Display self-corrects after suspend"
    was_wrong: >-
      Both instructed comparing the rendered countdown against the published RemainingSeconds
      property. RemainingSeconds is republished only on transitions, so between transitions it is a
      stale snapshot; a correct implementation appears to diverge from it by exactly the time elapsed
      since the last transition. Observed 200 seconds of false divergence shortly after a daemon
      restart.
    now: >-
      Both compare against the daemon's elapsed-derived remaining, read from
      ~/.local/state/cadence/session.json, sampled repeatedly to distinguish a constant offset from
      measurement noise.
