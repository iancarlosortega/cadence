product_decisions: confirmed

resolved_product_decisions:
  - id: P1
    question: >-
      After a logout kills the session bus, the daemon can still count and persist but can tell
      nobody. What should it do?
    raised_by: exploration Decision 2
    resolved: 2026-09-18
    decision: exit-cleanly-let-systemd-manage
    answer: >-
      The daemon should not outlive its session. Logout ends it cleanly and login brings it back
      automatically, so the panel is live immediately on re-login with no manual restart.
    rationale: >-
      The user chose this outcome over keeping a running daemon attached to a dead connection, which
      would have left the panel dim until a manual restart.
    implementation_note: >-
      The user's option was previewed as Restart=always with systemd retrying every 2s. That literal
      mechanism was rejected at proposal on measured evidence: this machine has StartLimitBurst=5
      over StartLimitIntervalUSec=10s with RestartUSec=2s, so a daemon exiting for want of a bus
      would exhaust the limit within ten seconds, be marked failed, and NOT return at login — worse
      than the defect. The chosen outcome is delivered instead by PartOf=graphical-session.target
      plus WantedBy=graphical-session.target, which stops the daemon cleanly at logout via the
      SIGTERM path it already implements and starts it at login, with no restart churn. The
      user-visible result is the one they selected.

resolved_technical_decisions:
  - id: D1
    question: What publish() should do when the bus is gone
    resolved: 2026-09-18
    decision: set-not-setmust
    answer: >-
      Use prop.Properties.Set and return the error through apply and Tick. main.go:104-107 already
      logs and continues on a Tick error; SetMust's panic simply bypassed handling that already
      existed. Kept as defence in depth even with the unit change, for the race where the bus dies
      moments before SIGTERM arrives.
  - id: D2
    question: How a startup gap should be interpreted
    resolved: 2026-09-18
    decision: reuse-suspend-rule
    answer: >-
      Apply EventSuspended{From: LastObserved, To: now} at startup. The gap is exactly the quantity
      that event already describes, so downtime inherits the table-tested suspend rule and M1
      decision P1 is satisfied without a second concept.
    known_trade: >-
      LastObserved can be up to 60s stale after a clean run, so this under-charges the phase by up to
      a minute. Today's behaviour over-charges without limit — an overnight shutdown bills eight
      hours of sleep as focus. A bounded under-charge under a minute is the better error and matches
      the 60s tolerance session-persistence already allows.

verified_facts:
  f3_panic: "panic: dbus: connection closed by user, prop.SetMust at service.go:199 via apply/Tick"
  f3_existing_error_path: "main.go:104-107 already logs a Tick error and continues"
  f4_divergence: "8h gap as downtime yields phase=break; the same 8h as suspend yields phase=focus"
  graphical_session_target: "active on this machine, ActiveEnterTimestamp matches the 2026-09-18 re-login"
  graphical_session_precedent: "at-spi-dbus-bus, flatpak-portal and ten gvfs-* services already bind to it"
  systemd_rate_limit: "StartLimitBurst=5, StartLimitIntervalUSec=10s, RestartUSec=2s"

risks:
  - Unit change may not stop the daemon at logout; verified by runbook after a real logout.
  - F4 under-charges by up to 60s after a clean restart; bounded and spec-tolerated.
  - Neither fix is provable by unit test alone; both need a real logout and a real long-gap restart.

notes:
  - SDD sub-agent dispatch is refused in this runtime, so all phases run inline, as in M1 and M2.
  - >-
    Both defects were found by running the system during M2 verification, not by reading it. That is
    now three such defects, none of which code review had surfaced.
