product_decisions: confirmed

resolved_product_decisions:
  - id: P1
    question: What a client displays while the user is idle.
    raised_by: exploration Decision 1
    blocks: [proposal]
    options:
      - id: A
        label: Reuse the existing Paused property
        cost: Zero daemon property changes, zero extension changes.
        defect: >-
          menuSensitivity (extension/render.js:48-57) derives the menu from the same flag, so an
          idle freeze would grey out Pause and offer Resume for a pause the user never requested.
          Resume maps to EventResume (machine.go:57-68), which recomputes ElapsedInPhase from
          PausedRemaining; firing it against an idle freeze that never set PausedRemaining is a
          state-corruption path, not a cosmetic one.
      - id: B
        label: Add an Idle boolean, reuse the paused freeze convention
        cost: >-
          The extension's interface XML is hardcoded (extension.js:25-41) and the proxy is built
          from it via Gio.DBusProxy.makeProxyWrapper, so a property absent from that XML is never
          surfaced. Adding Idle requires an extension change and makes panel-indicator a modified
          capability.
        benefit: Countdown and menu both stay truthful; reuses a convention already proved in production.
      - id: C
        label: Drop the idle-pause freeze entirely
        cost: >-
          A product reversal, not a technical simplification: short idle would count as work, and
          IdlePause plus its config key (config.go:85-89) become dead, which is a user-facing removal.
        benefit: >-
          No new property, no extension change, no IdleSince, no edge detection, and the defect
          disappears because no path declines to charge time without a transition. The only option
          that ships value while IdleSource is still stubbed.
    resolved: 2026-09-19
    decision: B
    status: confirmed
    recommendation_rationale: >-
      The only option that keeps both the countdown and the menu truthful, reusing the freeze
      convention this codebase already proved rather than inventing one. A is disqualified by the
      Resume-against-a-non-pause corruption path, not by taste. C is coherent and cheapest but
      silently reverses a product rule the user set at M1, so it is their call.
  - id: P2
    question: Run the sdd-research lane on the idle source before design?
    raised_by: exploration Decision 2
    blocks: [proposal, design]
    resolved: 2026-09-19
    decision: yes
    status: confirmed
    outcome: >-
      Lane ran and is recorded in research.md. C1/C2 removed the only feasibility blocker on Option
      B and established that no Shell-side reporter is needed, so the extension stays a pure
      consumer. C6 found native edge detection in Mutter, which may make reviving IdleSince
      unnecessary. C7 and C8 remain unverified and are carried as success criteria 5 and 6.
    recommendation_rationale: >-
      The idle source is the one material unknown, and the answer can eliminate options on
      feasibility grounds. A signal reachable only inside the Shell process would force a
      Shell-side reporter and invert M4's dependency direction, which is architecture, not detail.

verified_facts:
  idle_pipeline:
    port: "daemon/internal/session/ports.go:21-25, IdleSource.IdleFor(now)"
    production_stub: "daemon/cmd/cadenced/main.go:31-34 noIdleSource returns 0, wired at main.go:86"
    sampling: "daemon/internal/dbusapi/service.go:140-144, Tick reads IdleFor into EventTick"
    domain: "daemon/internal/session/machine.go:95-112, applyTick, three branches"
  both_idle_branches_unreachable_today: true
  unreachable_because: "IdleSource is stubbed to zero, so applyTick always takes its default branch"
  defect_location: "daemon/internal/session/machine.go:100-105"
  defect_mechanism: >-
    ElapsedInPhase freezes while wall time advances, so Remaining() (state.go:98-105) is constant
    while now moves. publish derives endsAt = now.Add(remaining).Unix() (service.go:205-213), so the
    correct PhaseEndsAt advances continuously across the whole idle window, not at its edges.
  false_comment: >-
    "nothing observable changed" at machine.go:101-103 is false and M4 owes its deletion.
  error_bound: >-
    7 minutes, from IdleCredit 10m minus IdlePause 3m (config.go:20-21). After that creditBreak
    fires and republishes anyway, so edge detection alone bounds the error rather than removing it.
  freeze_convention_already_exists:
    daemon: "service.go:206-213, when Paused remaining comes from PausedRemaining and endsAt is 0"
    client: "extension/render.js:30-39, computeDisplay branches on state.paused and reads remainingSeconds"
    pinned_by: "extension/test-render.js:86-87"
    significance: >-
      Not known when F2 was written. The question of what a client shows during a frozen interval is
      already answered in this codebase; M4's decision is which property carries it, not whether to
      freeze.
  dead_field: "IdleSince (state.go:53-57), declared with the exact edge-detection semantics an idle implementation needs, never read or written anywhere"
  extension_xml_is_hardcoded: "extension/extension.js:25-41, six properties; proxy built via makeProxyWrapper at extension.js:42"
  test_that_pins_the_old_requirement: "daemon/internal/session/machine_test.go:55-67 TestShortIdlePauses asserts len(effects) == 0"

inherited_obligations:
  from: "fix-suspend-deadline-republish finding F2"
  items:
    - Satisfy the daemon-control Change Notification requirement for the idle paths M4 makes reachable.
    - Decide what a client displays during an idle window, since the deadline advances throughout it.
    - Either bring the dead IdleSince field (state.go:53-57) to life or delete it.
    - Delete the "nothing observable changed" comment, which is false.

risks:
  - >-
    The idle source is an unknown and gates everything. Every option except C is worthless without a
    working IdleSource; C is the only branch that ships value with the adapter still stubbed.
  - >-
    Options A and B make panel-indicator a modified capability. M2 has been archived as
    consumer-only until now.
  - >-
    M4 makes a latent defect reachable. The adapter and the notification fix must land together, or
    M4 ships the very drift it exists to prevent.
  - >-
    TestShortIdlePauses (machine_test.go:55-67) is a correct test of an incorrect requirement.
    Options A and B invert its assertion, so the spec must move before the test.
  - >-
    Screen lock interacts with idle and is unexamined. Locked-and-idle may need to differ from
    idle-at-desk; nothing in the current spec addresses it.

notes:
  - >-
    SDD sub-agent dispatch is refused in this runtime (the Claude Code hook cannot transport
    authenticated caller provenance), so all phases run inline, as in M1, M2, M3 and
    fix-suspend-deadline-republish.
