    delta_sections: [NEW]
    requirements: 6
    scenarios: 15
    word_count: 912
    note: >-
      New capability, so the whole spec is the delta. Two requirements carry the milestone's real
      risk. Self-Owned Exit lists four dismissal paths and states explicitly that the overlay MUST
      NOT depend on the daemon to end it, with a scenario for the daemon vanishing mid-overlay — that
      scenario exists because F3 proved it can. Overlay Presence states the no-modal-grab decision as
      a prohibition with a scenario asserting keyboard switching still works, so a later change
      cannot quietly add a grab and call it an improvement.
      Hold To Skip also forbids the overlay ending the break itself: it requests SkipBreak and waits
      for the resulting property change, which keeps invariant I1 intact on the one control that
      would be most tempting to shortcut.
  design:
    state: done
    artifact: openspec/changes/m3-break-overlay/design.md
    decisions: 6
    threat_matrix: not-applicable
    word_count: 1114
    note: >-
      Decision 1 makes three of the four Self-Owned Exit paths unit-testable without a Shell, because
      the remainder reaching zero, the phase leaving break, and the daemon going away all reduce to
      one pure predicate returning false. Decision 4 destroys the actor rather than hiding it, since
      _trackActor untracks chrome on destroy — a hidden actor would leave an input region registered
      for something invisible, which is a plausible way to end up with a screen area that silently
      eats clicks. Decision 5 has the hold NOT dismiss the overlay itself: it calls SkipBreak and
      waits for the daemon's property change, keeping invariant I1 intact at the one control where
      shortcutting it would be most tempting.
    convergence_note: >-
      Every dismissal path converges on the same predicate returning false. There is one way the
      overlay comes down, reached four ways — which is why a vanished daemon cannot leave the screen
      covered.
