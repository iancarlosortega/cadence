change: m3-break-overlay
project: cadence
created: 2026-09-18
artifact_store: openspec
execution_mode: interactive
delivery_strategy: single-pr
chain_strategy: null
delivery_note: >-
  Preflight carried forward from this session: interactive pace, openspec artifacts, single-pr
  delivery. Commit and push remain separate human decisions.

summary: >-
  M3 — a full-screen break overlay on the primary monitor with hold-to-skip. Consumer-only: SkipBreak
  already exists in the daemon. No modal grab by product decision, so the overlay blocks mouse input
  but leaves the keyboard free. Suppressed for the whole break if the primary monitor is fullscreen
  when it starts. The overlay owns its own exit so a vanished daemon cannot leave the screen covered.

