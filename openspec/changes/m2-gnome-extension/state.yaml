invariants:
  - id: I1
    name: The daemon decides, the tick only renders
    statement: >
      D-Bus properties are authoritative for state (phase, paused, session existence);
      the local 1s tick is authoritative for presentation only. The tick MUST NOT decide
      or infer a transition, MUST NOT flip focus to break when its own countdown reaches
      zero, MUST NOT clear SessionActive, and MUST NOT write any daemon-owned state. At
      zero it renders 00:00 and waits.
    rationale: >
      A tick allowed to conclude anything becomes a second timer, and two timers drift.
      The daemon's elapsed-in-phase survives suspend by design
      (daemon/internal/session/state.go:46-50); a client-side countdown does not.
      Recomputing the display from the absolute PhaseEndsAt every tick is self-correcting
      across missed signals, suspend, and clock jumps.
    binds: [specs, design, verify]
    encoded_by:
      - spec requirement "State Authority"
      - spec requirement "Countdown Derivation"
      - design Decision 1 (render is a pure function of state and now)
    tested_by:
      - success criterion 7 (stopped daemon)
      - success criterion 8 (suspend)

product_decisions: confirmed

resolved_product_decisions:
  - id: P1
    question: >
      What does the panel indicator show when the daemon is not running, or when it is
      running but no session is active?
    raised_by: exploration Decision 2, Risks
    resolved: 2026-09-18
    decision: dimmed-icon
    answer: >
      The indicator is always present in the panel. When the daemon is absent or no
      session is active it renders a dimmed icon with no countdown label. When a session
      is active it renders icon plus MM:SS. At T-2min in focus the label and icon take
      the amber style class.
    rationale: >
      A hidden indicator makes a dead daemon indistinguishable from a deliberate idle
      state — silent failure in exactly the component whose milestone goal is proving the
      two halves talk. A dimmed icon keeps a predictable panel position and is itself the
      liveness signal.

resolved_technical_decisions:
  - id: D1
    question: Where the T-2min amber threshold lives
    resolved: 2026-09-18
    decision: hardcoded-120s
    answer: >
      A named constant in the extension. No warning threshold exists in config.toml, and
      the daemon has no channel to hand a preference to the extension other than a new
      D-Bus property. M6 (config hot reload) is the milestone that earns the right to
      make it tunable.
  - id: D2
    question: The extension uuid
    resolved: 2026-09-18
    decision: cadence@ian.dev
    answer: >
      Durable across packaging and the install path, exactly as dev.ian.Cadence was fixed
      in M1. Install path is ~/.local/share/gnome-shell/extensions/cadence@ian.dev/.
  - id: D3
    question: Install path shape for the extension and the cadenced binary
    resolved: 2026-09-18
    decision: makefile
    answer: >
      A Makefile in packaging/. One target builds cadenced into ~/.local/bin, installs the
      extension into ~/.local/share/gnome-shell/extensions/cadence@ian.dev/, and installs
      the existing systemd user unit. It will be run repeatedly during the Wayland dev
      loop, so it is automation, not documentation.

  - id: D4
    question: Amber styling token
    resolved: 2026-09-18
    decision: local-class-two-stylesheets
    answer: >
      Define a local .cadence-warning class and ship it twice, as stylesheet-dark.css and
      stylesheet-light.css. Settled at design by extracting GNOME 48.8's own shipped theme
      rather than by documentation.
    evidence: >
      gresource extract of /usr/share/gnome-shell/gnome-shell-theme.gresource shows the
      complete set of St custom properties available to an extension is exactly five:
      -st-accent-color, -st-accent-fg-color, -st-hfade-offset, -st-icon-style,
      -st-vfade-offset. Searching both gnome-shell-dark.css and gnome-shell-light.css for
      .warning, .error, .destructive, .success returns zero matches — there is no warning
      token to inherit. -st-accent-color is the user's accent, not a semantic warning, and
      would make the warning state indistinguishable from ordinary chrome (and meaningless
      if the user's accent is itself amber). Two stylesheets are required because #panel
      background differs by theme: #000000 dark, #fafafb light (line 1776 of each). The
      two-stylesheet mechanism is GNOME's own precedent — the shipped
      window-list@gnome-shell-extensions.gcampax.github.com extension, also
      shell-version ["48"], ships stylesheet-dark.css and stylesheet-light.css side by side.

