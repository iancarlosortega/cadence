delivery_note: >-
  Preflight carried forward from this session: interactive pace, openspec artifacts, single-pr
  delivery. Expected well under 150 lines. Commit and push remain separate human decisions.

summary: >-
  Fix two daemon defects found while verifying M2 on real hardware. F3: a logout panics the process
  because publish uses prop.SetMust, which panics on a closed bus; fixed by using Set and by binding
  the unit to graphical-session.target so the daemon no longer outlives its session. F4: daemon
  downtime is billed as focus work; fixed by applying the startup gap as EventSuspended so downtime
  and suspend obey one rule.

